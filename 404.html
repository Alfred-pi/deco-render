<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Deco Render</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F2EC">
<meta name="color-scheme" content="light">
<script>
/* GitHub Pages sert cette page pour toute adresse inconnue, quelle que soit sa profondeur :
   les chemins relatifs doivent donc repartir de la racine du site.
   Sur *.github.io, la racine est le premier segment (/deco-render/) ; avec un domaine propre, c’est « / ».
   Ouverte directement (…/404.html), la page n’a besoin d’aucune base. */
(function () {
  var path = location.pathname;
  if (/\/404\.html$/.test(path)) return;
  var root = /\.github\.io$/.test(location.hostname) ? "/" + path.split("/")[1] + "/" : "/";
  document.write('<base href="' + root + '">');
})();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="assets/site.css">
</head>

</header>
<main class="wrap lost">

  </section>
</main>
</body>
</html>
